<!doctype html>
<html lang="ko" data-style="toon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1d2a4a">
<title>온라인 크리스마스 — 눈마을 광장</title>
<link rel="icon" href="/favicon.svg">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#172432;touch-action:none;-webkit-user-select:none;user-select:none}
canvas#scene{display:block;position:fixed;inset:0;width:100%;height:100%}
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#1d2a4a;color:#f4efe6;font:600 15px "Apple SD Gothic Neo",Pretendard,sans-serif;transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#loading .ld-title{font-size:30px;font-weight:900;letter-spacing:-.03em}
#loading .ld-sub{font-size:12px;color:#c9d4ea;margin-top:2px}
#loading .ld-msg{margin-top:18px;color:#c9d4ea}
.joy{position:fixed;z-index:8;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:rgba(251,243,223,.25);border:2px solid rgba(251,243,223,.7);pointer-events:none}
.joy-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:rgba(251,243,223,.9);box-shadow:0 2px 6px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="loading"><div style="text-align:center"><div class="ld-sub">온라인 시리즈 ③</div><div class="ld-title">온라인 크리스마스</div><div class="ld-msg">준비 중…</div></div></div>
<script type="module" src="/src/christmas/main.js"></script>
</body>
</html>
