<!doctype html><html lang="ko" data-style="toon" data-mountain="namsan"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#173f36"><title>산길 · 남산 온라인 등반</title><meta name="description" content="백범광장에서 성곽 계단길을 따라 남산 정상까지 동동이와 30분. 낮·노을·밤 서울을 내려다봐요."><link rel="canonical" href="https://engchoon.github.io/ai-office-world/hiking/namsan/"><meta property="og:type" content="website"><meta property="og:site_name" content="온라인 메타버스"><meta property="og:locale" content="ko_KR"><meta property="og:url" content="https://engchoon.github.io/ai-office-world/hiking/namsan/"><meta property="og:title" content="온라인 등산 — 남산 성곽 계단길"><meta property="og:description" content="백범광장에서 성곽 계단길을 따라 남산 정상까지 동동이와 30분. 낮·노을·밤 서울을 내려다봐요."><meta property="og:image" content="https://engchoon.github.io/ai-office-world/og/og-hiking.png"><meta name="twitter:card" content="summary_large_image"><link rel="apple-touch-icon" sizes="180x180" href="/og/icon-hiking-180.png"><link rel="icon" href="/og/favicon-hiking.svg" type="image/svg+xml"><style id="loading-screen-style">
/* 로딩 화면: 시각을 알기 전이라 늘 '밤 크라프트' 종이(등산 수첩 톤). 사양 6절 */
#loading-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:linear-gradient(180deg,#0d2a25 0%,#173f36 45%,#2d5a45 100%);color:#f1e4c4;font-family:"Apple SD Gothic Neo","Pretendard",-apple-system,"Malgun Gothic",sans-serif;overflow:hidden;transition:opacity .8s ease,visibility .8s}
#loading-screen.leaving{opacity:0;visibility:hidden;pointer-events:none}
#loading-screen .ls-sky{position:absolute;inset:0;background:radial-gradient(60% 40% at 72% 22%,#f0d9a233,transparent 70%)}
#loading-screen .ls-ridge{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%}
#loading-screen .ls-ridge path{transition:transform 1.2s ease}
#loading-screen .ls-card{position:relative;z-index:1;width:min(600px,calc(100% - 28px));margin-bottom:max(48px,calc(env(safe-area-inset-bottom) + 16px));padding:28px 22px 18px;border-radius:6px 6px 14px 14px;background:#3b3024;box-shadow:2px 3px 0 #17110a,0 18px 40px rgba(20,12,2,.45),inset 0 1px 0 rgba(255,236,200,.12)}
#loading-screen .ls-card::before{content:"";position:absolute;left:18px;right:18px;top:8px;height:10px;background:radial-gradient(circle at 7px 5px,#17110a 0 3.2px,transparent 3.6px) 0 0/22px 10px repeat-x;opacity:.85}
#loading-screen .ls-brand{display:flex;align-items:baseline;gap:10px;margin:0 0 2px;font-size:12px;letter-spacing:2px;color:#c9b48c}
#loading-screen .ls-brand b{font-size:19px;letter-spacing:2px;color:#f1e4c4}
#loading-screen h1{margin:0 0 12px;font-size:clamp(17px,4.4vw,19px);line-height:1.3;letter-spacing:-.02em;font-weight:900}
#loading-screen .ls-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:800;margin-bottom:6px;color:#f1e4c4}
#loading-screen .ls-percent{font-variant-numeric:tabular-nums;font-weight:800;color:#f3a48c}
#loading-screen .ls-track{height:10px;border-radius:4px;background:#2a2219;overflow:hidden}
#loading-screen .ls-fill{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#9cc27a,#e5b453);border-radius:4px;transition:transform .35s ease}
#loading-screen .ls-steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:800}
#loading-screen .ls-steps li{padding:4px 9px;border-radius:5px;background:#43372a;color:#c9b48c;box-shadow:1px 2px 0 #17110a}
#loading-screen .ls-steps li[data-state=active]{color:#f1e4c4;outline:1.5px dashed #e5b453}
#loading-screen .ls-steps li[data-state=done]{color:#1d2a12;background:#9cc27a}
#loading-screen .ls-steps li[data-state=done]::before{content:'✓ '}
#loading-screen .ls-tip{min-height:3.2em;margin:12px 0 0;padding-top:10px;border-top:1px dashed #5a4a35;font-size:13px;line-height:1.55;color:#c9b48c;transition:opacity .26s}
#loading-screen .ls-tip.swap{opacity:0}
#loading-screen .ls-tip::before{content:'산행 안내 · ';color:#e5b453;font-weight:800}
#loading-screen .ls-message{margin:10px 0 0;font-size:13px;line-height:1.5;color:#e5b453}
#loading-screen .ls-message:empty{display:none}
#loading-screen .ls-action{display:block;margin:12px 0 0 auto;min-height:48px;padding:0 26px;font:inherit;font-size:15px;font-weight:900;border-radius:10px;border:2px dashed #e6b7a4;background:#b0442f;color:#fff;box-shadow:0 3px 0 #5e2216;cursor:pointer}
#loading-screen .ls-action[hidden]{display:none}
#loading-screen .ls-action:hover{filter:brightness(1.08)}
#loading-screen .ls-action:disabled{opacity:.5}
#loading-screen[data-phase=error] .ls-fill{background:#e0735a}
#loading-screen[data-phase=ready] .ls-fill{background:#9cc27a}
@media (orientation:portrait){#loading-screen .ls-card{margin-bottom:max(16px,calc(env(safe-area-inset-bottom) + 16px));padding:24px 16px 14px}#loading-screen .ls-ridge{height:48%}#loading-screen .ls-steps{font-size:11px}}
@media (orientation:landscape) and (max-height:540px){#loading-screen .ls-ridge{display:none}#loading-screen{justify-content:center}#loading-screen .ls-card{width:min(560px,calc(100% - 28px));margin-bottom:0;padding:22px 18px 12px}#loading-screen h1{margin-bottom:8px}#loading-screen .ls-steps{margin-top:8px}#loading-screen .ls-tip{margin-top:8px;padding-top:8px;min-height:2.6em}#loading-screen .ls-action{margin-top:8px}}
@media (prefers-reduced-motion:reduce){#loading-screen,#loading-screen .ls-fill,#loading-screen .ls-tip{transition:none}}
</style>
</head><body class="ns-page">
