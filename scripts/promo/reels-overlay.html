<!doctype html>
<html lang="ko" data-hud-time="day">
<head>
<meta charset="utf-8">
<title>릴스 오버레이 (1080×1920)</title>
<!-- 색·글꼴 토큰은 등산 수첩 원본을 그대로 불러 쓴다(--paper, --stamp, --ink, --edge, --nb-font …). 새 색·새 글꼴 없음. -->
<link rel="stylesheet" href="../../src/hud-notebook.css">
<style>
/* 사용법: docs/흡연장/릴스-콘티.md 4장. 1080×1920 고정 무대.
   인스타 가림 영역: 위 220 · 아래 420 · 오른쪽 120 → 글자는 y 220~1500 안에만 둔다.
   11-14 대표 지적("정가운데가 아님"): 상자를 왼쪽 48px에 붙이지 않고 화면 한가운데(x 120~960, 폭 840)에 둔다. 오른쪽 끝 960은 가림 영역 경계와 같다. */
html,body{margin:0;padding:0;background:transparent}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:var(--nb-font);color:var(--ink);-webkit-font-smoothing:antialiased}
/* 안전 영역 안내선: ?guide=1 */
.guide{display:none;position:absolute;left:120px;top:220px;width:840px;height:1280px;outline:4px dashed #f0f;pointer-events:none;z-index:99}
body[data-guide="1"] .guide{display:block}
.stage{position:absolute;inset:0}
.hide{display:none!important}

/* 공통 도장 */
.stamp{display:inline-block;border:6px solid var(--stamp);color:var(--stamp);border-radius:18px;padding:6px 22px;font-weight:900;letter-spacing:-.02em;transform:rotate(-4deg);background:rgba(255,248,238,.9)}
html[data-hud-time=night] .stamp{background:rgba(59,48,36,.92)}

/* ───────── 가. 안내 띠(처음·끝) : 위 안전선 바로 아래 ───────── */
.notice{position:absolute;left:120px;top:240px;width:840px;box-sizing:border-box;padding:18px 24px;text-align:center;
 background:var(--paper);border:6px solid var(--stamp);border-radius:24px;box-shadow:var(--soft);
 color:var(--stamp);font-size:40px;line-height:1.25;font-weight:900;letter-spacing:-.03em}
.notice small{display:block;margin-top:6px;font-size:40px;font-weight:700;color:var(--ink2);letter-spacing:-.02em}

/* ───────── 나. 자막 띠 : 아래 안전선(y1500) 바로 위 ───────── */
.cap{position:absolute;left:120px;width:840px;bottom:440px;box-sizing:border-box;padding:40px 36px 34px;
 background:var(--paper);border:6px solid var(--edge);border-radius:28px;box-shadow:var(--lift),var(--soft);text-align:center}
.cap::before{content:"";position:absolute;inset:10px;border:3px dashed var(--rule);border-radius:20px;pointer-events:none}
.cap .tag{position:absolute;left:28px;top:-34px;transform:rotate(-5deg);font-size:34px;padding:2px 20px;border-width:5px;border-radius:14px}
.cap .txt{position:relative;font-size:68px;line-height:1.28;font-weight:900;letter-spacing:-.04em;color:var(--ink);word-break:keep-all}
.cap .chips{position:relative;display:flex;flex-wrap:nowrap;gap:10px;justify-content:center;margin-top:0}
.cap .chip{flex:1;padding:16px 4px;border:5px solid var(--edge);border-radius:20px;background:var(--paper2);font-size:34px;font-weight:900;color:var(--ink2);white-space:nowrap}
.cap .chip.on{background:var(--stamp);border-color:var(--stamp-d);color:#fff;box-shadow:4px 6px 0 var(--stamp-d)}

/* ───────── 다. AI Office 장면 · 엔딩 카드 (11-14: 온라인 등산 릴스와 같은 짜임) ─────────
   AI Office 장면 = 등산 릴스 12-office와 같은 앱 캡처(artifacts/reels/office/ai-office.png)·같은 문구·같은 흰 글자.
   엔딩 = 등산 ending.html과 같은 순서(큰 제목 → 그림 → '지금 바로 · 브라우저에서' 주소 → 'AI Office로 만든 게임' 카드).
   흡연장만 다른 점: 맨 위 금연 안내 띠, 그림은 산 대신 노을 진 도심 옥상. */
.office{position:absolute;left:50%;transform:translateX(-50%);top:280px;border-radius:28px;overflow:hidden;background:#fbf3df;box-shadow:0 18px 50px rgba(0,0,0,.55);border:6px solid #fbf3df}
.office img{display:block;height:880px;width:auto}
.ocap{position:absolute;left:0;right:0;bottom:440px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;color:#fff8e6;font-family:'Apple SD Gothic Neo','Pretendard',sans-serif}
.ocap div{white-space:nowrap;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.ocap .b{font-weight:800;font-size:76px;line-height:1.2;letter-spacing:-1px}.ocap .s{font-weight:500;font-size:44px;line-height:1.25}
.end{position:absolute;inset:0;background:#4a556b;font-family:'Apple SD Gothic Neo','Pretendard',sans-serif;color:#4a3618}
.end .sky{position:absolute;inset:0 0 auto 0;height:1100px;background:linear-gradient(#f2c49c,#fbe0c0 70%,#fbf3df)}
.end .sun{position:absolute;left:640px;top:620px;width:150px;height:150px;border-radius:50%;background:#f39a5b;box-shadow:0 0 0 24px rgba(243,154,91,.28)}
.end svg.city{position:absolute;left:0;top:560px;width:1080px;height:560px}
.end .notice{top:240px}
.end .safe{position:absolute;left:120px;top:250px;width:840px;height:1250px;display:flex;flex-direction:column;align-items:center}
.end .t1{margin-top:190px;font-size:84px;font-weight:900;letter-spacing:-2px;text-align:center;color:#4a3618;text-shadow:0 4px 0 #fbf3df;white-space:nowrap}
.end .t1 small{display:block;font-size:40px;font-weight:700;letter-spacing:0;color:#7a5f3a;margin-top:14px}
.end .card{margin-top:auto;width:840px;box-sizing:border-box;background:#fbf3df;border:6px solid #4a3618;border-radius:36px;box-shadow:0 12px 0 #b49563;padding:48px 40px;text-align:center}
.end .card .k{font-size:36px;font-weight:700;color:#7a5f3a}
.end .card .url{margin-top:12px;white-space:nowrap;font-size:44px;font-weight:900;color:#b8452e;letter-spacing:-1px;line-height:1.25}
.end .ai{margin-top:34px;padding-top:30px;border-top:4px dashed #d9c79d;font-size:52px;font-weight:900;line-height:1.3}
.end .ai em{font-style:normal;color:#2f6b4a;background:#dcefd8;border-radius:14px;padding:0 14px}
.end .ai small{display:block;font-size:34px;font-weight:700;color:#7a5f3a;margin-top:10px}

/* ───────── 라. 표지 ───────── */
.cover{position:absolute;inset:0;background:var(--paper2) center/cover no-repeat}
.cover .card{position:absolute;left:120px;top:560px;width:840px;box-sizing:border-box;padding:56px 40px 52px;text-align:center;
 background:var(--paper);border:6px solid var(--edge);border-radius:32px;box-shadow:var(--lift),var(--soft)}
.cover .card::before{content:"";position:absolute;inset:12px;border:3px dashed var(--rule);border-radius:22px;pointer-events:none}
.cover .series{position:relative;font-size:44px;font-weight:900;color:var(--stamp)}
.cover h1{position:relative;margin:8px 0 0;font-size:140px;line-height:1.05;font-weight:900;letter-spacing:-.06em;color:var(--ink)}
.cover .sub{position:relative;margin:24px 0 0;font-size:50px;font-weight:900;color:var(--ink);letter-spacing:-.03em;word-break:keep-all}
.cover .seal{position:absolute;right:26px;top:-44px;font-size:36px;transform:rotate(7deg)}
</style>
</head>
<body>
<div class="guide"></div>
<div class="stage" id="stage"></div>
<script>
/* 장면 표(콘티와 같은 값). 편집 스크립트가 길이·시간대를 여기서 읽어도 된다: window.reelsOverlay.SCENES */
const SCENES=[
 {n:0,sec:3,  scene:'afterparty',time:'night',tag:'옥상',   cap:'회사 옥상,|잠깐 바람 쐬러 갈래요?',notice:1},
 {n:1,sec:3,  scene:'morning',   time:'day',  tag:'입장',   cap:'몸에 해로운 건|하나도 없어요'},
 {n:2,sec:4,  scene:'morning',   time:'day',  tag:'고르기', cap:'오늘은 어떤 맛?'},
 {n:3,sec:5,  scene:'lunch',     time:'day',  tag:'꿀모금', cap:'꾹 눌러 꿀모금|도넛 링 묘기'},
 {n:4,sec:5,  scene:'lunch',     time:'day',  tag:'수다',   cap:'점심 먹고 온 친구와|인사하고 수다 떨고'},
 {n:5,sec:4,  scene:'evening',   time:'dusk', tag:'쉬기',   cap:'난간에 기대|캔커피 한 잔'},
 {n:6,sec:5,  scene:'morning',   time:'day',  tag:'상황',   cap:'',chips:1},
 {n:7,sec:5,  scene:'afterparty',time:'night',tag:'온라인', cap:'친구랑 같이 피우기|(온라인)'},
 {n:8,sec:3,  scene:'afterparty',time:'night',tag:'금연',   cap:'피울수록 아끼는|담뱃값'},
 {n:9,sec:2,  scene:'afterparty',time:'night',tag:'',       cap:'',office:1},
 {n:10,sec:3.5,scene:'afterparty',time:'night',tag:'',      cap:'',ending:1},
];
const CHIPS=[['morning','☕ 출근 전'],['lunch','🍱 점심'],['evening','🌇 퇴근길'],['afterparty','🍻 회식 후']];
const NOTICE='가상 흡연장 · 진짜 담배 없음 · 금연 응원';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br=s=>esc(s).split('|').join('<br>');

function render(o){
 const S=SCENES[+o.scene]||{};
 const mode=o.mode||(S.ending?'ending':S.office?'office':'caption');
 const time=o.time||(mode==='caption'?S.time:'day')||'day';
 document.documentElement.dataset.hudTime=time;
 document.body.dataset.guide=o.guide?'1':'';
 const url=o.url||'https://(접속 주소 자리)';
 let h='';
 if(mode==='caption'){
  const text=o.cap??S.cap??'';
  const notice=o.notice!=null?+o.notice:S.notice;
  if(notice)h+=`<div class="notice">${NOTICE}</div>`;
  const body=S.chips&&!o.cap?`<div class="chips">${CHIPS.map(([id,t])=>`<span class="chip${id===o.hl?' on':''}">${t}</span>`).join('')}</div>`:`<div class="txt">${br(text)}</div>`;
  const tag=o.tag??S.tag;
  h+=`<div class="cap">${tag?`<span class="stamp tag">${esc(tag)}</span>`:''}${body}</div>`;
 }else if(mode==='office'){
  // 등산 릴스와 같은 앱 캡처·문구. 글자 바깥선은 등산 reels-edit.mjs RING과 같은 값(8px #2b1d0a 세 겹)
  const ring=[8,5.5,3].flatMap(r=>{const k=r>5?32:16;return Array.from({length:k},(_,i)=>{const a=i/k*2*Math.PI;return `${(r*Math.cos(a)).toFixed(2)}px ${(r*Math.sin(a)).toFixed(2)}px 0 #2b1d0a`;});}).join(',');
  h+=`<div class="office"><img src="${esc(o.img||'/artifacts/reels/office/ai-office.png')}"></div>
  <div class="ocap" style="text-shadow:${ring}"><div class="b">이 게임, AI 직원들이<br>AI Office에서 만들었어요</div><div class="s">기획·디자인·개발 전부</div></div>`;
 }else if(mode==='ending'){
  // 주소는 도메인 뒤 첫 '/'에서 줄을 바꾼다(등산 엔딩과 같은 두 줄)
  const k=url.indexOf('/'),urlHTML=k>0?esc(url.slice(0,k+1))+'<br>'+esc(url.slice(k+1)):esc(url);
  h+=`<div class="end"><div class="sky"></div><div class="sun"></div>
  <svg class="city" viewBox="0 0 1080 560" aria-hidden="true">
   <path d="M0 330 H90 V250 H170 V300 H250 V190 H330 V280 H420 V230 H500 V140 H580 V260 H680 V210 H760 V290 H850 V170 H930 V250 H1080 V560 H0Z" fill="#b6b3c2"/>
   <path d="M0 420 H120 V340 H220 V390 H300 V300 H400 V370 H480 V320 H600 V400 H690 V330 H800 V380 H900 V310 H1000 V390 H1080 V560 H0Z" fill="#8790a6"/>
   <path d="M0 500 H1080 V560 H0Z" fill="#4a556b"/>
   <path d="M0 470 H1080 V478 H0Z M40 478 V500 M140 478 V500 M240 478 V500 M340 478 V500 M440 478 V500 M540 478 V500 M640 478 V500 M740 478 V500 M840 478 V500 M940 478 V500 M1040 478 V500" stroke="#4a556b" stroke-width="8" fill="#4a556b"/>
  </svg>
  <div class="notice">${NOTICE}<small>실제 담배 판매·권유 없는 체험 게임이에요</small></div>
  <main class="safe"><h1 class="t1">회사 옥상, 집에서 쉬어요<small>온라인 흡연장 · 무료 웹 게임</small></h1>
   <section class="card"><div class="k">지금 바로 · 브라우저에서</div><div class="url">${urlHTML}</div>
    <div class="ai"><em>AI Office</em>로 만든 게임<small>기획·디자인·개발, 모두 AI 직원들이</small></div></section></main></div>`;
 }else if(mode==='cover'){
  const bg=o.bg?`style="background-image:url('${esc(o.bg)}')"`:'';
  h+=`<div class="cover" ${bg}><div class="notice">${NOTICE}</div>
  <div class="card"><span class="stamp seal">금연 응원</span>
   <div class="series">온라인 시리즈 ②</div><h1>온라인<br>흡연장</h1>
   <div class="sub">진짜 담배 없는<br>옥상 쉬는 시간</div></div></div>`;
 }
 document.getElementById('stage').innerHTML=h;
 return document.fonts.ready.then(()=>{document.body.dataset.ready='1';return mode;});
}
window.reelsOverlay={SCENES,CHIPS,NOTICE,show:o=>{document.body.dataset.ready='';return render(o);}};
const q=Object.fromEntries(new URLSearchParams(location.search));
render(q);
</script>
</body>
</html>
