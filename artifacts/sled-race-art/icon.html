<!doctype html><meta charset="utf-8"><style>
body{margin:0;background:#2a3550;font:600 15px "Apple SD Gothic Neo",sans-serif;color:#f1e4c4;display:flex;gap:36px;padding:28px;align-items:center}
.c{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:rgba(251,243,223,.9);color:#4a3618;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.c.over{background:#b9472f;color:#fff}.c svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;--ic-point:#cfe0f2}
.c.over svg{--ic-point:rgba(255,255,255,.28)}figure{margin:0;display:grid;justify-items:center;gap:8px}
</style>
<figure><div class="c"><svg><use href="/icons/sprite.svg#ic-x-throw-cancel"/></svg></div>새 ✕ 평소</figure>
<figure><div class="c over"><svg><use href="/icons/sprite.svg#ic-x-throw-cancel"/></svg></div>새 ✕ 손가락 위</figure>
<figure><div class="c"><svg><use href="/icons/sprite.svg#ic-c-close"/></svg></div>예전(공통 닫기)</figure>
<figure><div class="c"><svg><use href="/icons/sprite.svg#ic-x-snowball"/></svg></div>❄ 던지기(참고)</figure>
